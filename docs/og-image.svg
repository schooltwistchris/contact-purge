<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#131a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="65%">
      <stop offset="0" stop-color="#5b8def" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#5b8def" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#7aa5ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent-bar)"/>

  <!-- Eyebrow badge -->
  <g transform="translate(600, 110)">
    <rect x="-150" y="-20" width="300" height="40" rx="20"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <text x="0" y="6" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif"
          font-size="14" font-weight="600"
          letter-spacing="3" fill="#8a93a8">
      ANDROID · FREE · OPEN SOURCE
    </text>
  </g>

  <!-- Headline -->
  <text x="600" y="280" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-size="108" font-weight="700"
        letter-spacing="-3" fill="#f3f5fa">
    Contact Purge
  </text>

  <!-- Tagline -->
  <text x="600" y="345" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-size="34" font-weight="400" fill="#8a93a8">
    Clean out your contacts.
  </text>

  <!-- Filter pill row mockup -->
  <g transform="translate(600, 440)">
    <!-- All (selected) -->
    <g transform="translate(-330, 0)">
      <rect x="0" y="0" width="100" height="48" rx="24" fill="#5b8def"/>
      <text x="50" y="30" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif"
            font-size="18" font-weight="600" fill="white">All</text>
    </g>
    <!-- Service codes -->
    <g transform="translate(-216, 0)">
      <rect x="0" y="0" width="200" height="48" rx="24"
            fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
      <text x="100" y="30" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif"
            font-size="18" font-weight="500" fill="#cdd3e0">Service codes</text>
    </g>
    <!-- Duplicates -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="48" rx="24"
            fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
      <text x="80" y="30" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif"
            font-size="18" font-weight="500" fill="#cdd3e0">Duplicates</text>
    </g>
    <!-- No phone or email -->
    <g transform="translate(176, 0)">
      <rect x="0" y="0" width="240" height="48" rx="24"
            fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
      <text x="120" y="30" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif"
            font-size="18" font-weight="500" fill="#cdd3e0">No phone or email</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="600" y="570" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500" fill="#5a6478">
    github.com/schooltwistchris/contact-purge
  </text>
</svg>
